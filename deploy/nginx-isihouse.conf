server {
    listen 80;
    listen [::]:80;
    server_name isihouse.ru www.isihouse.ru;
    return 301 https://isihouse.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.isihouse.ru;
    ssl_certificate /etc/letsencrypt/live/isihouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isihouse.ru/privkey.pem;
    return 301 https://isihouse.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name isihouse.ru;

    ssl_certificate /etc/letsencrypt/live/isihouse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isihouse.ru/privkey.pem;

    root /var/www/isihouse;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1M;

    location /api/leads {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt  { }
    location = /sitemap.xml { }
    location = /llms.txt    { default_type text/plain; }

    location / {
        try_files $uri $uri/ =404;
    }
}
